    <title>Hebrew Helper — иврит для техников и общения</title>
        <style>
        html, body {
            overscroll-behavior-y: none;
            overflow-x: hidden;
            touch-action: pan-y;
        }
    </style>
    <script>
        let touchStartY = 0;
        window.addEventListener('touchstart', function(e) {
            touchStartY = e.touches[0].clientY;
        }, { passive: true });

        window.addEventListener('touchmove', function(e) {
            let touchY = e.touches[0].clientY;
            let currentScrollY = window.scrollY;
            if (currentScrollY <= 0 && touchY > touchStartY) {
                e.preventDefault();
            }
        }, { passive: false });
    </script>
