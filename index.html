    <script>
      (function () {
        // Блокировка overscroll на уровне CSS
        var style = document.createElement('style');
        style.innerHTML =
          'html, body, #root, .app-container {' +
          'overscroll-behavior: none !important;' +
          'overscroll-behavior-y: none !important;' +
          'touch-action: pan-x pan-y !important;' +
          '}';
        document.head.appendChild(style);

        // Низкоуровневый перехватчик Touch-событий (Capturing Phase)
        var startY = 0;

        window.addEventListener(
          'touchstart',
          function (e) {
            if (e.touches.length === 1) {
              startY = e.touches[0].clientY;
            }
          },
          { passive: false, capture: true }
        );

        window.addEventListener(
          'touchmove',
          function (e) {
            if (e.touches.length !== 1) return;

            var deltaY = e.touches[0].clientY - startY;

            // Если движение идет ВНИЗ (попытка скролла вверх или рефреша)
            if (deltaY > 0) {
              var el = e.target;
              var canScrollUp = false;

              while (el && el !== document.body && el !== document.documentElement) {
                if (el.scrollTop > 0) {
                  canScrollUp = true;
                  break;
                }
                el = el.parentElement;
              }

              if (!canScrollUp) {
                var doc = document.scrollingElement || document.documentElement;
                if (doc && doc.scrollTop > 0) canScrollUp = true;
              }

              // Если находимся в самом верху контейнера и тянем вниз — БЛОКИРУЕМ НАМЕРТВО
              if (!canScrollUp) {
                if (e.cancelable) {
                  e.preventDefault();
                  e.stopPropagation();
                }
              }
            }
          },
          { passive: false, capture: true }
        );

        window.addEventListener(
          'touchend',
          function () {
            startY = 0;
          },
          { passive: false, capture: true }
        );
      })();
    </script>
