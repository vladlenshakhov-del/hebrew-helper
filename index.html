        <style>
  html, body, #root {
    overscroll-behavior-y: none !important;
    overflow-y: auto !important;
    -webkit-overflow-scrolling: touch;
  }
</style>
<script>
  document.addEventListener('touchmove', function(e) {
    // Жёстко блокируем попытку браузера дернуть рефреш при любом свайпе у верхнего края
    if (window.pageYOffset <= 0) {
      // Разрешаем скролл вниз, но глушим отскок вверх
      let touchY = e.touches[0].clientY;
      if (touchY > window.lastTouchY && window.pageYOffset === 0) {
        // Если тянем вниз на самом верху — гасим дефолтное поведение WebView
        e.preventDefault();
      }
    }
    window.lastTouchY = e.touches[0].clientY;
  }, { passive: false });
</script>
